# Tuesday props settlement — the small cron the dev brief specifies.
# 18:00 UTC Tuesday = ~1pm ET, well after Monday-night stat corrections land in
# nflverse. The door sweeps every week still carrying unsettled props and
# reports weeks whose stat file hasn't printed yet without touching them, so a
# re-run (workflow_dispatch) is always safe.
name: settle-props
on:
  schedule:
    - cron: "0 18 * * 2"
  workflow_dispatch: {}

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Settle unsettled prop weeks
        env:
          HOUSE_KEY: ${{ secrets.LEAGUE_HOUSE_KEY }}
        run: |
          set -euo pipefail
          out=$(curl -sf -X POST \
            "https://xtgkasakmioyzpwiwejk.supabase.co/functions/v1/league?settle_props" \
            -H "x-house-key: ${HOUSE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "${out}"
          echo "${out}" | grep -q '"ok":true'

      # The podium post, CHAINED — never its own cron. A separate Tuesday timer
      # races this settle and will eventually post a podium for a week that has
      # not finished settling; chaining guarantees the ordering. The week itself
      # settles off the Sunday/Monday sweep, so ?settle is nudged first and a
      # week that still has not settled is reported and skipped, not failed.
      - name: Post the podium
        env:
          HOUSE_KEY: ${{ secrets.LEAGUE_HOUSE_KEY }}
        run: |
          set -euo pipefail
          base="https://xtgkasakmioyzpwiwejk.supabase.co/functions/v1/league"
          # The nudge exists for ORDERING (settle before podium), not as the
          # alarm — settle.yml owns that, hourly. But it no longer throws the
          # body away: this line discarding its response is how a completely
          # dead settlement read as a green week. Report and carry on; two jobs
          # going red for the same condition trains everyone to ignore both.
          settle=$(curl -s -X POST "${base}?settle" \
            -H "x-house-key: ${HOUSE_KEY}" -H "Content-Type: application/json" -d '{}')
          echo "${settle}"
          if [ "$(printf '%s' "${settle}" | jq -r '.ok // "absent"')" != "true" ]; then
            echo "::warning::settle reports the ledger is owed a result — see the hourly settle workflow"
          fi
          out=$(curl -s -X POST "${base}?post_x" \
            -H "x-house-key: ${HOUSE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"kind":"podium"}')
          echo "${out}"
          if echo "${out}" | grep -q '"ok":true'; then exit 0; fi
          if echo "${out}" | grep -q 'week has not settled'; then
            echo "::notice::week not settled yet — podium skipped, re-dispatch when it lands"
            exit 0
          fi
          echo "::error::podium post failed"; exit 1
